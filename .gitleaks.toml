[extend]
useDefault = true

[allowlist]
description = "Known test placeholders from check-secrets.test.mjs (also echoed in agent-logs)"
regexTarget = "secret"
regexes = [
  '''xxx-replace-me''',
  '''your-key-here''',
  '''changeme-please''',
  '''paste-your-salt-here''',
  # localStorage key names such as WARMTH_KEY = "lectoria.warmth.v2"
  '''^lectoria\.[a-z][a-z0-9.-]*$''',
]
