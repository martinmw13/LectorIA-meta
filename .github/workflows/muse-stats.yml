name: muse-stats

# Regenerates docs/MUSE.md after each push to main. Pushes made with
# GITHUB_TOKEN do not trigger workflows, so the update commit does not loop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: muse-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Regenerate docs/MUSE.md
        run: node scripts/muse-stats.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit if changed
        run: |
          git diff --quiet -- docs/MUSE.md && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update docs/MUSE.md' -- docs/MUSE.md
          git push origin HEAD:main
