name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Generate Next.js types
        # Recreates gitignored next-env.d.ts (and route types) before typecheck.
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Hook tests
        run: npm run test:hooks
      - name: Processed book data
        run: npm run check:data
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Scene isolation check
        run: npm run check:isolation
      - name: Built-in secret scan
        run: node scripts/check-secrets.mjs --all
      - name: Install pinned gitleaks
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz' | sha256sum -c -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks scan
        run: gitleaks git . --redact --no-banner --exit-code 1
