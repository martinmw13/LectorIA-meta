<!-- Question: does a quiet right margin collect generated images while the text stays the hero | Direction: Folio margin -->
<div class="shell">

{"n":1,"mood":"sorrow","emotions":[["sorrow",0.9],["calm",0.07],["suspense",0.02],["joy",0],["mystery",0],["adventure",0],["battle",0],["wonder",0]],"intensity":0.24,"paragraphs":["Dorothy lived in the midst of the great Kansas prairies, with Uncle Henry, who was a farmer, and Aunt Em, who was the farmer\u2019s wife. Their house was small, for the lumber to build it had to be carried by wagon many miles. There were four walls, a floor and a roof, which made one room; and this room contained a rusty looking cookstove, a cupboard for the dishes, a table, three or four chairs, and the beds. Uncle Henry and Aunt Em had a big bed in one corner, and Dorothy a little bed in another corner. There was no garret at all, and no cellar\u2014except a small hole dug in the ground, called a cyclone cellar, where the family could go in case one of those great whirlwinds arose, mighty enough to crush any building in its path. It was reached by a trap door in the middle of the floor, from which a ladder led down into the small, dark hole.","When Dorothy stood in the doorway and looked around, she could see nothing but the great gray prairie on every side. Not a tree nor a house broke the broad sweep of flat country that reached to the edge of the sky in all directions. The sun had baked the plowed land into a gray mass, with little cracks running through it. Even the grass was not green, for the sun had burned the tops of the long blades until they were the same gray color to be seen everywhere. Once the house had been painted, but the sun blistered the paint and the rains washed it away, and now the house was as dull and gray as everything else.","When Aunt Em came there to live she was a young, pretty wife. The sun and wind had changed her, too. They had taken the sparkle from her eyes and left them a sober gray; they had taken the red from her cheeks and lips, and they were gray also. She was thin and gaunt, and never smiled now. When Dorothy, who was an orphan, first came to her, Aunt Em had been so startled by the child\u2019s laughter that she would scream and press her hand upon her heart whenever Dorothy\u2019s merry voice reached her ears; and she still looked at the little girl with wonder that she could find anything to laugh at.","Uncle Henry never laughed. He worked hard from morning till night and did not know what joy was. He was gray also, from his long beard to his rough boots, and he looked stern and solemn, and rarely spoke.","It was Toto that made Dorothy laugh, and saved her from growing as gray as her other surroundings. Toto was not gray; he was a little black dog, with long silky hair and small black eyes that twinkled merrily on either side of his funny, wee nose. Toto played all day long, and Dorothy played with him, and loved him dearly."]},
{"n":2,"mood":"suspense","emotions":[["suspense",1],["calm",0],["joy",0],["sorrow",0],["mystery",0],["adventure",0],["battle",0],["wonder",0]],"intensity":0.67,"paragraphs":["Today, however, they were not playing. Uncle Henry sat upon the doorstep and looked anxiously at the sky, which was even grayer than usual. Dorothy stood in the door with Toto in her arms, and looked at the sky too. Aunt Em was washing the dishes.","From the far north they heard a low wail of the wind, and Uncle Henry and Dorothy could see where the long grass bowed in waves before the coming storm. There now came a sharp whistling in the air from the south, and as they turned their eyes that way they saw ripples in the grass coming from that direction also.","Suddenly Uncle Henry stood up.","\u201cThere\u2019s a cyclone coming, Em,\u201d he called to his wife. \u201cI\u2019ll go look after the stock.\u201d Then he ran toward the sheds where the cows and horses were kept.","Aunt Em dropped her work and came to the door. One glance told her of the danger close at hand.","\u201cQuick, Dorothy!\u201d she screamed. \u201cRun for the cellar!\u201d","Toto jumped out of Dorothy\u2019s arms and hid under the bed, and the girl started to get him. Aunt Em, badly frightened, threw open the trap door in the floor and climbed down the ladder into the small, dark hole. Dorothy caught Toto at last and started to follow her aunt. When she was halfway across the room there came a great shriek from the wind, and the house shook so hard that she lost her footing and sat down suddenly upon the floor."]},

{"n":4,"mood":"calm","emotions":[["calm",0.55],["suspense",0.38],["mystery",0.05],["adventure",0.01],["joy",0],["sorrow",0],["battle",0],["wonder",0]],"intensity":0.4,"paragraphs":["It was very dark, and the wind howled horribly around her, but Dorothy found she was riding quite easily. After the first few whirls around, and one other time when the house tipped badly, she felt as if she were being rocked gently, like a baby in a cradle.","Toto did not like it. He ran about the room, now here, now there, barking loudly; but Dorothy sat quite still on the floor and waited to see what would happen.","Once Toto got too near the open trap door, and fell in; and at first the little girl thought she had lost him. But soon she saw one of his ears sticking up through the hole, for the strong pressure of the air was keeping him up so that he could not fall. She crept to the hole, caught Toto by the ear, and dragged him into the room again, afterward closing the trap door so that no more accidents could happen.","Hour after hour passed away, and slowly Dorothy got over her fright; but she felt quite lonely, and the wind shrieked so loudly all about her that she nearly became deaf. At first she had wondered if she would be dashed to pieces when the house fell again; but as the hours passed and nothing terrible happened, she stopped worrying and resolved to wait calmly and see what the future would bring. At last she crawled over the swaying floor to her bed, and lay down upon it; and Toto followed and lay down beside her.","In spite of the swaying of the house and the wailing of the wind, Dorothy soon closed her eyes and fell fast asleep."]}]};

  box.querySelectorAll("[data-x]").forEach(function(x){x.addEventListener("click",function(e){e.stopPropagation();var g=findGen(x.getAttribute("data-x"));if(g)openLB(g.src,x);});});
  box.querySelectorAll("[data-xart]").forEach(function(x){x.addEventListener("click",function(e){e.stopPropagation();openLB(IMG[scene],x);});});
  var art=box.querySelector("[data-sceneart]");
  if(art)art.addEventListener("click",function(){var fi=document.getElementById("figImg");if(fi){fi.scrollIntoView({block:"nearest"});fi.classList.remove("show");void fi.offsetWidth;fi.classList.add("show");}readcol.focus({preventScroll:true});});
  box.querySelectorAll("[data-goto]").forEach(function(b){b.addEventListener("click",function(){
    var f=readcol.querySelector('[data-gid="'+b.getAttribute("data-goto")+'"]');
    if(f){scrollFigIntoView(f);f.classList.remove("ring");void f.offsetWidth;f.classList.add("ring");setTimeout(function(){f.classList.remove("ring");},1300);}
  });});
}
function renderAll(){renderImg();renderRead();renderMargin();renderDev();}
/* selection popover + picture this */
var selpop=document.getElementById("selpop"),pendingSel=null;
function hideSelPop(){selpop.style.display="none";pendingSel=null;}
document.getElementById("selpopBtn").addEventListener("click",function(){
  if(!pendingSel)return;
  var quote=pendingSel.text,para=pendingSel.para;hideSelPop();insertGen(quote,para,false);
});
document.addEventListener("mouseup",function(){
  setTimeout(function(){
    var s=getSelection();
    if(!s||s.isCollapsed||String(s).trim().length<3){hideSelPop();return;}
    if(!readcol.contains(s.anchorNode)||!readcol.contains(s.focusNode)){hideSelPop();return;}
    var r=s.getRangeAt(0).getBoundingClientRect(),txt=String(s).trim();
    var node=s.focusNode,pe=null;
    if(node.nodeType===1&&node.closest)pe=node.closest("p[data-pi]");
    else if(node.parentElement)pe=node.parentElement.closest?node.parentElement.closest("p[data-pi]"):null;
    var para=pe?parseInt(pe.getAttribute("data-pi"),10):0;
    pendingSel={text:txt,para:para};
    selpop.style.display="block";
    var pw=selpop.offsetWidth;
    selpop.style.left=Math.max(8,Math.min(innerWidth-pw-8,r.left+r.width/2-pw/2))+"px";
    selpop.style.top=Math.max(8,r.top-8-selpop.offsetHeight)+"px";
  },10);
});
document.addEventListener("mousedown",function(e){if(!selpop.contains(e.target))hideSelPop();});
function insertGen(quote,para,instant){
  var g=mkGen(quote,para);genStore[scene].push(g);
  renderRead();renderMargin();
  var f=readcol.querySelector('[data-gid="'+g.id+'"]');
  if(!f)return;
  if(instant){finishGen(g.id);return;}
  f.innerHTML='<div class="genload">Illustrating\u2026</div>';
  setTimeout(function(){finishGen(g.id);},1400);
}
function scrollFigIntoView(fig){
  if(!fig)return;
  var p=fig.previousElementSibling,para=null;
  while(p){if(p.tagName==="P"&&p.hasAttribute("data-pi")){para=p;break;}p=p.previousElementSibling;}
  var rc=readcol,pad=14;
  var rcR=rc.getBoundingClientRect(),f=fig.getBoundingClientRect();
  if(f.height>rcR.height-2*pad){rc.scrollTop+=(f.top-rcR.top)-pad;return;}
  if(f.bottom>rcR.bottom-pad)rc.scrollTop+=(f.bottom-(rcR.bottom-pad));
  if(para){var pb=para.getBoundingClientRect().bottom,top=rc.getBoundingClientRect().top;if(pb<top+pad)rc.scrollTop-=(top+pad-pb);}
}
function finishGen(gid){
  var g=findGen(gid);if(!g)return;
  renderRead();renderMargin();
  var f=readcol.querySelector('[data-gid="'+gid+'"]');
  if(f){var im=f.querySelector("img");requestAnimationFrame(function(){im.classList.add("show");});scrollFigIntoView(f);}
}
/* panels modal */
var pmodal=document.getElementById("pmodal"),pdlg=document.getElementById("pdlg"),pReturn=null;
function panelsGridHTML(){
  var h='<div class="pgrid" style="margin-top:0">';
  for(var i=0;i<6;i++){var p=PANELS[i];
    h+='<div class="panel"><div class="art">';
    if(p.img)h+='<img src="'+p.img+'" alt="" style="object-position:'+p.pos+'" data-full="'+p.img+'" tabindex="0">';
    else h+='<div class="hatch" style="position:absolute;inset:0"></div>';
    h+='<span class="pnum">'+(i+1)+'</span></div><div class="capbox">'+esc(p.cap)+'</div></div>';
  }
  return h+'</div><div class="mocktag sans">Mock panels</div>';
}
function openPanels(direct,ret){
  pReturn=ret||document.activeElement;
  if(direct||panelsMode){showPanelsGrid();}
  else{
    pdlg.innerHTML='<button id="px" aria-label="Close">&times;</button><div class="gate"><div class="kick2 sans" style="font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)">Chapter in panels</div><h1 class="chap" style="font-size:32px">The Cyclone in Panels</h1><p>Shows the whole chapter, including what happens next.</p><div class="gbtnrow"><button class="gbtn pri" id="pgShow">Show panels</button><button class="gbtn sec" id="pgNo">Not now</button></div></div>';
    pmodal.classList.add("open");
    document.getElementById("pgShow").addEventListener("click",showPanelsGrid);
    document.getElementById("pgNo").addEventListener("click",closePanels);
    document.getElementById("px").addEventListener("click",closePanels);
    document.getElementById("pgShow").focus();
  }
}
function showPanelsGrid(){
  pdlg.innerHTML='<button id="px" aria-label="Close">&times;</button><div class="kick2 sans" style="font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)">Chapter in panels</div><h1 class="chap" style="font-size:32px;margin-bottom:4px">The Cyclone in Panels</h1>'+panelsGridHTML();
  if(!pmodal.classList.contains("open"))pmodal.classList.add("open");
  document.getElementById("px").addEventListener("click",closePanels);
  pdlg.querySelectorAll("[data-full]").forEach(function(im){im.style.cursor="zoom-in";
    im.addEventListener("click",function(){openLB(im.getAttribute("data-full"),im);});
    im.addEventListener("keydown",function(e){if(e.key==="Enter")openLB(im.getAttribute("data-full"),im);});});
  document.getElementById("px").focus();
}
function panelsIsOpen(){return pmodal.classList.contains("open");}
function closePanels(){pmodal.classList.remove("open");if(pReturn&&pReturn.focus)try{pReturn.focus({preventScroll:true});}catch(e){pReturn.focus();}}
pmodal.addEventListener("click",function(e){if(e.target===pmodal)closePanels();});
/* dev panel */
var dev=document.getElementById("dev");
function renderDev(){
  var sc=CHAPTER.scenes[scene-1],em=sc.emotions.slice().sort(function(a,b){return b[1]-a[1];});
  var h='<div class="dhead"><span class="dtag">DEV</span><span style="color:var(--mut)">scene '+scene+' of 4</span><button class="dx" id="devx" aria-label="Close dev panel">&times;</button></div>';
  h+='<div class="drow">Jev mood: '+esc(sc.mood)+'</div>';
  em.forEach(function(e,i){h+='<div class="dbar"><span>'+esc(e[0])+'</span><span class="dtr"><span class="dfl'+(i===0?" top":"")+'" style="width:'+Math.round(e[1]*100)+'%"></span></span><span class="dnum">'+e[1].toFixed(2)+'</span></div>';});
  h+='<div class="drow">intensity <span class="mono">'+sc.intensity.toFixed(2)+'</span></div>';
  h+='<div class="drow">Track: Symphony No. 6 \u2013 IV <span class="mono">(score .82)</span></div>';
  h+='<div class="drow">Scheduler: holding current track \u00B7 <span class="mono">32 s</span> left in dwell</div>';
  h+='<div class="dfoot">133 scenes \u00B7 Muse Spark 1.3 \u00B7 Jev 1.14 \u00B7 <span class="mono">$0.0252</span></div>';

  document.getElementById("devx").addEventListener("click",closeDev);

function devIsOpen(){return dev.classList.contains("open");}
function openDev(){renderDev();dev.classList.add("open");}
function closeDev(){dev.classList.remove("open");}
if(qi("dev"))openDev();
document.addEventListener("keydown",function(e){
  if(xOpen&&e.key==="Escape"){collapseX();return;}
  if(lbIsOpen()){if(e.key==="Escape")closeLB();return;}
  if(panelsIsOpen()){if(e.key==="Escape")closePanels();return;}
  if(devIsOpen()&&e.key==="Escape"){closeDev();return;}
  if((e.shiftKey&&(e.key==="D"||e.key==="d"))){e.preventDefault();devIsOpen()?closeDev():openDev();return;}
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.key==="[")psGo(-1);
  else if(e.key==="]")psGo(1);
});
/* nav */
function go(d){
  if(panelsMode&&d<0){panelsMode=false;scene=4;renderAll();return;}
  var n=scene+d;
  if(n>4){panelsMode=true;renderAll();return;}
  if(n<1||n>4)return;
  panelsMode=false;scene=n;renderAll();
}
document.getElementById("prevBtn").addEventListener("click",function(){go(-1);});
document.getElementById("nextBtn").addEventListener("click",function(){go(1);});
/* divider */
var divider=document.getElementById("divider"),dragging=false;
function defaultW(){return Math.round(mid.getBoundingClientRect().width*0.30);}
function applyW(px){px=Math.max(220,Math.min(Math.round(innerWidth*0.46),px));mid.style.setProperty("--imgw",px+"px");return px;}
try{var saved=parseInt(localStorage.getItem("lectoria.proto.v3.split"),10);if(saved)applyW(saved);else applyW(defaultW());}catch(e){applyW(defaultW());}
divider.addEventListener("pointerdown",function(e){dragging=true;divider.classList.add("drag");try{divider.setPointerCapture(e.pointerId);}catch(x){}});
divider.addEventListener("pointermove",function(e){if(!dragging)return;var r=mid.getBoundingClientRect();applyW(e.clientX-r.left);});
divider.addEventListener("pointerup",function(e){if(!dragging)return;dragging=false;divider.classList.remove("drag");var r=mid.getBoundingClientRect();try{localStorage.setItem("lectoria.proto.v3.split",Math.round(e.clientX-r.left));}catch(x){}});
divider.addEventListener("dblclick",function(){var w=applyW(defaultW());try{localStorage.setItem("lectoria.proto.v3.split",w);}catch(x){}});
