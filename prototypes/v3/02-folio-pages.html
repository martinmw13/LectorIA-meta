<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>The Cyclone · Lectoria Folio Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff; --ink:#111; --blue:#0866FF; --blue-dark:#0064E0;
  --sel:#CFE1FF; --hair:#D8D5CE; --mut:#6B675F; --soft:#F4F2EC;
  --cream:#F7F1DE; --imgw:340px; --ph-a:#E9E2D2; --ph-b:#DCD3BC;
}
html[data-theme="dark"]{
  --paper:#11181C; --ink:#E4E6EB; --blue:#2D88FF; --blue-dark:#4A9BFF;
  --sel:#1E3A5F; --hair:#232D34; --mut:#9AA5B1; --soft:#151C21;
  --cream:#1B2229; --ph-a:#222B33; --ph-b:#182027;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,serif;-webkit-font-smoothing:antialiased;transition:background .15s ease,color .15s ease;overflow:hidden}
.sans{font-family:"Instrument Sans",Helvetica,Arial,sans-serif}
.shell{max-width:1200px;margin:20px auto 24px;padding:0 40px;height:calc(100vh - 44px);display:flex;flex-direction:column;overflow:hidden}
.mast{display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--ink);flex:none}
.mast .brand{font-family:"Instrument Sans",sans-serif;font-size:14px;font-weight:600;letter-spacing:.28em;white-space:nowrap}
.mast .book{flex:1;text-align:center;font-family:"Instrument Sans",sans-serif;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast .book .loc{color:var(--mut);letter-spacing:.08em}
.tbtn{width:34px;height:34px;border:1px solid var(--hair);background:var(--paper);color:var(--ink);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tbtn:hover{border-color:var(--blue);color:var(--blue)}
.tbtn svg{stroke:currentColor;fill:none;stroke-width:1.5}
.mid{display:grid;grid-template-columns:var(--imgw) 12px minmax(0,1fr);gap:0;margin-top:14px;align-items:stretch;flex:1;min-height:0;overflow:hidden}
.imgcol{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.frame{position:relative;flex:1;min-height:0;height:100%;border:1px solid var(--hair);border-radius:8px;overflow:hidden;background:#E7E0CF}
html[data-theme="dark"] .frame{background:#1A2128}
.ph{position:absolute;inset:0;background:#E7E0CF;overflow:hidden}
html[data-theme="dark"] .ph{background:#1A2128}
.ph .blob{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none}
.ph .b1{width:75%;height:46%;left:-12%;top:-8%;background:#D9CFB6;opacity:.85}
.ph .b2{width:70%;height:52%;right:-16%;top:26%;background:#CFC9BC;opacity:.8}
.ph .b3{width:80%;height:44%;left:6%;bottom:-16%;background:#EFE8D6;opacity:.9}
html[data-theme="dark"] .ph .b1{background:#2A333C;opacity:.9}
html[data-theme="dark"] .ph .b2{background:#232B33;opacity:.9}
html[data-theme="dark"] .ph .b3{background:#161D23;opacity:.9}
.ph .grain{position:absolute;inset:0;opacity:.22;pointer-events:none}
.ph .wash{position:absolute;inset:0;background:#DCD3BC;opacity:.14;pointer-events:none}
html[data-theme="dark"] .ph .wash{background:#0E1419;opacity:.2}
.picbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Instrument Sans",sans-serif;font-size:13px;color:var(--blue);border:1px solid var(--blue);background:var(--paper);border-radius:999px;padding:8px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.picbtn:hover{color:var(--blue-dark);border-color:var(--blue-dark)}
.picbtn svg{stroke:currentColor;fill:none;stroke-width:1.5}
.figimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;display:block;cursor:zoom-in;opacity:0;transform:scale(1.02)}
.figimg.show{opacity:1;transform:scale(1);transition:opacity .4s ease,transform .4s ease}
.figimg.clean{transition:none;opacity:1;transform:none}
html[data-theme="dark"] .figimg.show{filter:brightness(.92)}
html[data-theme="dark"] .figimg.clean{filter:brightness(.92)}
.mockbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--mut);margin:0;font-family:"Instrument Sans",sans-serif;font-size:13px;color:var(--mut);padding:24px;opacity:0}
.mockbox.show{opacity:1;transition:opacity .4s ease}
.mockbox.clean{transition:none;opacity:1}
.imgcap{font-family:"Instrument Sans",sans-serif;font-size:11.5px;color:var(--mut);margin-top:7px;letter-spacing:.03em}
.imgcap a{color:var(--blue);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.imgcap a svg{stroke:currentColor;fill:none;stroke-width:1.5;vertical-align:-1px}
.recap{border:1px solid var(--hair);border-radius:8px;background:var(--soft);padding:26px 22px;flex:1;min-height:0}
.recap .rk{font-family:"Instrument Sans",sans-serif;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.recap p{font-size:19px;line-height:1.6;margin-top:10px}
.div{position:relative;cursor:col-resize;display:flex;justify-content:center}
.div::before{content:"";width:1px;background:var(--hair);height:100%}
.div:hover::before,.div.drag::before{background:var(--blue)}
.grip{position:absolute;top:50%;transform:translateY(-50%);width:14px;height:44px;border:1px solid var(--hair);border-radius:7px;background:var(--paper);opacity:0;transition:opacity .15s ease;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:10px;font-family:"Instrument Sans",sans-serif}
.div:hover .grip{opacity:1}
.read{min-width:0;padding-left:34px;max-width:720px;min-height:0;overflow:hidden;padding-bottom:8px;padding-right:12px;outline:none}
#pagewrap{will-change:transform,opacity}
#pagewrap.slide{transition:transform .2s ease-out,opacity .2s ease-out}
.kick{font-family:"Instrument Sans",sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.kick.slim{color:var(--mut);font-size:11.5px;margin-bottom:10px}
h1.chap{font-weight:300;font-size:38px;line-height:1.05;letter-spacing:-.01em;margin:6px 0 4px;font-variation-settings:"opsz" 72}
.sceneline{display:flex;align-items:center;gap:10px;font-family:"Instrument Sans",sans-serif;font-size:12.5px;color:var(--mut);letter-spacing:.06em;margin-bottom:10px}
.body{max-width:64ch;font-size:19.5px;line-height:1.65}
.body p{margin:0}
.body p + p{text-indent:1.5em}
.body p.lead::first-letter{color:var(--blue);font-size:3.2em;float:left;line-height:.86;padding:4px 10px 0 0;font-weight:300}
.body p + .ptfig,.ptfig + p{margin-top:.6em}
.ptfig + p{text-indent:1.5em}
.sel{background:var(--sel);padding:1px 0}
#selpop{position:fixed;display:none;z-index:60}
.pop{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:var(--paper);color:var(--ink);font-family:"Instrument Sans",sans-serif;font-size:12.5px;border:1px solid var(--ink);border-radius:6px;white-space:nowrap;z-index:5}
.pop::after{content:"";position:absolute;top:calc(100% - 4px);left:50%;width:7px;height:7px;background:var(--paper);border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.pop button{background:none;border:0;color:var(--blue);font:inherit;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;cursor:pointer}
.pop svg{stroke:currentColor;fill:none;stroke-width:1.5}
::selection{background:var(--sel)}
.ptfig{position:relative;margin:.7em 0;max-width:min(440px,100%)}
.ptfig img.ptimg{display:block;width:100%;aspect-ratio:4/3;max-height:300px;object-fit:cover;border:1px solid var(--hair);border-radius:6px;cursor:zoom-in;opacity:0}
.ptfig img.ptimg.show{opacity:1;transition:opacity .4s ease}
html[data-theme="dark"] .ptfig img.ptimg{filter:brightness(.92)}
.ptfig figcaption{margin-top:6px;font-size:16.5px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptfig figcaption .q{font-style:normal}
.ptfig .credit{display:inline;font-family:"Instrument Sans",sans-serif;font-size:11.5px;color:var(--mut);letter-spacing:.04em;margin-left:6px;white-space:nowrap}
.ptfig .credit svg{stroke:var(--blue);fill:none;stroke-width:1.5;vertical-align:-1px}
.ptx{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--hair);background:var(--paper);color:var(--mut);font-size:14px;line-height:1;cursor:pointer;font-family:"Instrument Sans",sans-serif;z-index:2}
.ptx:hover{color:var(--blue);border-color:var(--blue)}
.ptload{position:relative;overflow:hidden;background:var(--soft);border:1px solid var(--hair);border-radius:6px;aspect-ratio:4/3}
.ptload .sh{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);animation:sh 1.4s linear infinite}
html[data-theme="dark"] .ptload .sh{background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.09) 50%,transparent 65%)}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.ptlab{font-family:"Instrument Sans",sans-serif;font-size:12px;color:var(--mut);letter-spacing:.06em;margin-top:6px}
.ptfig.pulse{animation:pulse 1s ease-out 2;border-radius:6px}
.frame.pulse{animation:pulse 1s ease-out 2;border-radius:8px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(8,102,255,.55)}100%{box-shadow:0 0 0 12px rgba(8,102,255,0)}}
.dots{display:flex;gap:7px;justify-content:center;margin-top:14px}
.dots button{width:6px;height:6px;border-radius:50%;border:0;background:var(--hair);cursor:pointer;padding:0}
.dots button.on{background:var(--blue)}
.dots button:hover{background:var(--blue-dark)}
.gstrip{border:1px solid var(--hair);border-radius:8px;background:var(--soft);margin-bottom:12px;overflow:hidden}
.gstrip .grow{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--ink);font-family:"Instrument Sans",sans-serif;font-size:13px;padding:9px 12px;cursor:pointer;text-align:left}
.gstrip .grow:hover{color:var(--blue-dark)}
.gstrip .minis{display:flex;gap:4px;margin-left:2px}
.gstrip .minis img{width:30px;height:22px;object-fit:cover;border-radius:3px;border:1px solid var(--hair);filter:blur(2px) saturate(.6)}
.gstrip .chev{margin-left:auto;color:var(--mut);font-size:12px}
.gstrip .chev svg{stroke:currentColor;fill:none;stroke-width:1.5}
.gthumbs{display:flex;gap:12px;padding:4px 12px 12px;flex-wrap:wrap}
.gthumb{background:none;border:0;padding:0;cursor:pointer;width:120px;text-align:left}
.gthumb img{width:120px;height:90px;object-fit:cover;border:1px solid var(--hair);border-radius:6px;display:block}
html[data-theme="dark"] .gthumb img{filter:brightness(.92)}
.gthumb:hover img{border-color:var(--blue)}
.gthumb .gc{display:block;font-size:13.5px;line-height:1.35;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pcard{border:1px solid var(--ink);border-radius:8px;background:var(--paper);padding:12px 14px;margin-bottom:12px}
.pcard .ptitle{font-style:italic;font-size:19px;margin-bottom:8px}
.pcard .prow{display:flex;gap:6px;margin-bottom:8px}
.pcard .mini{flex:1;height:52px;border:1px solid var(--ink);border-radius:4px;overflow:hidden;position:relative;background:var(--cream)}
.pcard .mini img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(3px) saturate(.5)}
.pcard .mini .hatch{position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(17,17,17,.10) 7px 8px)}
html[data-theme="dark"] .pcard .mini .hatch{background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(228,230,235,.12) 7px 8px)}
.pcard .pgate{font-family:"Instrument Sans",sans-serif;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.pcard .pbtns{display:flex;gap:8px}
.pbtn{font-family:"Instrument Sans",sans-serif;font-size:13px;border-radius:6px;padding:7px 16px;cursor:pointer;border:1px solid var(--blue)}
.pbtn.primary{background:var(--blue);color:#fff}
.pbtn.primary:hover{background:var(--blue-dark)}
.pbtn.ghost{background:var(--paper);color:var(--ink);border-color:var(--hair)}
.pbtn.ghost:hover{border-color:var(--blue);color:var(--blue)}
.pslim{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:6px;color:var(--mut);font-family:"Instrument Sans",sans-serif;font-size:13px;padding:2px 0;cursor:pointer;margin-bottom:12px;text-align:left}
.pslim:hover{color:var(--blue)}
.pslim svg{stroke:currentColor;fill:none;stroke-width:1.5;flex:none}
.pslim .phint{font-size:12px;opacity:.75}
.panelshead .kick2{font-family:"Instrument Sans",sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.panel{border:1px solid var(--ink);border-radius:6px;background:var(--cream);overflow:hidden}
.panel .art{height:120px;position:relative;overflow:hidden;background:var(--cream)}
.panel .art img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
html[data-theme="dark"] .panel .art img{filter:brightness(.92)}
.hatch{position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(17,17,17,.10) 7px 8px)}
html[data-theme="dark"] .hatch{background:repeating-linear-gradient(45deg,transparent 0 7px,rgba(228,230,235,.12) 7px 8px)}
html[data-theme="dark"] .panel{border-color:#3A4650}
.panel .pnum{position:absolute;top:6px;left:6px;width:22px;height:22px;border:1px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",sans-serif;font-size:12px;display:flex;align-items:center;justify-content:center}
.panel .capbox{border-top:1px solid var(--ink);padding:7px 9px;font-size:15px;line-height:1.4}
html[data-theme="dark"] .panel .capbox{border-top-color:#3A4650}
.mocktag{font-family:"Instrument Sans",sans-serif;font-size:11.5px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-top:10px}
.ch2btn{margin-top:12px;font-family:"Instrument Sans",sans-serif;font-size:13px;background:var(--blue);border:1px solid var(--blue);color:#fff;border-radius:6px;padding:9px 18px;cursor:pointer}
.ch2btn:hover{background:var(--blue-dark)}
#pmodal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:90;padding:40px}
#pmodal.open{display:flex}
.pmbox{background:var(--paper);border-radius:8px;max-width:660px;width:100%;max-height:86vh;overflow:hidden;padding:22px 24px;position:relative;border:1px solid var(--hair)}
.pmbox h2{font-weight:400;font-size:26px;margin:2px 0 4px}
.pmbox .pgate{font-family:"Instrument Sans",sans-serif;font-size:13px;color:var(--mut);margin:6px 0 12px}
.pmbox .pbtns{display:flex;gap:8px;margin-top:4px}
#pmx{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--hair);background:var(--paper);color:var(--ink);font-size:16px;cursor:pointer}
#pmx:hover{border-color:var(--blue);color:var(--blue)}
.folio{margin-top:12px;border-top:1px solid var(--ink);min-height:64px;padding:10px 0 4px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;flex:none}
.fleft{display:flex;flex-direction:column;gap:5px;min-width:250px;width:250px;flex:none}
.navrow{display:flex;align-items:center;gap:6px}
.navbtn{background:none;border:0;font-family:"Instrument Sans",sans-serif;font-size:13px;cursor:pointer;color:var(--ink);padding:6px 6px}
.navbtn:hover{color:var(--blue-dark)}
.navbtn:disabled{opacity:.3;cursor:default}
.navlbl{font-family:"Instrument Sans",sans-serif;font-size:13px;letter-spacing:.04em;white-space:nowrap}
.panelsbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--hair);border-radius:6px;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",sans-serif;font-size:12.5px;padding:5px 10px;cursor:pointer;margin-left:8px}
.panelsbtn:hover{border-color:var(--blue);color:var(--blue)}
.panelsbtn svg{stroke:currentColor;fill:none;stroke-width:1.5}
.fprog{display:block}
.ticks{display:flex;gap:1px;align-items:flex-end;height:12px;width:100%}
.ticks i{flex:1;min-width:1px;height:4px;background:var(--hair)}
.ticks i.on{background:var(--blue);height:7px}
.ticklbl{display:block;font-family:"Instrument Sans",sans-serif;font-size:11px;color:var(--mut);letter-spacing:.06em;margin-top:3px;white-space:nowrap}
.fmid{display:flex;align-items:center;gap:10px;justify-content:center}
.icbtn{width:34px;height:34px;border:1px solid var(--ink);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;flex:none}
.icbtn:hover{border-color:var(--blue-dark)}
.icbtn:hover svg{stroke:var(--blue-dark)}
.icbtn svg{stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:square}
.icbtn.play{background:var(--blue);border-color:var(--blue)}
.icbtn.play svg{stroke:#fff;fill:#fff}
.vol{display:inline-flex;align-items:center;gap:6px}
.vol input{width:64px;accent-color:var(--blue);cursor:pointer}
.nowp{font-style:italic;font-size:15.5px;line-height:1.35;max-width:300px}
.nowp a{color:var(--blue);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.nowp a svg{stroke:currentColor;fill:none;stroke-width:1.5;vertical-align:-1px}
.fright{display:flex;align-items:center;gap:12px;justify-content:flex-end}
.seg2{display:inline-flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;font-family:"Instrument Sans",sans-serif;font-size:12px}
.seg2 button{border:0;background:var(--paper);color:var(--ink);padding:8px 13px;font:inherit;cursor:pointer}
.seg2 button.on{background:var(--ink);color:var(--paper)}
html[data-theme="dark"] .seg2 button.on{color:#11181C;background:#E4E6EB}
.chopinbtn{background:none;border:0;padding:0;cursor:pointer;width:52px;flex:none;transform:rotate(-6deg)}
.chopinbtn img{width:52px;height:auto;display:block;border-radius:50%}
.chopinbtn:active{outline:2px solid var(--blue);outline-offset:2px}
#dev{position:fixed;right:24px;bottom:112px;width:320px;background:var(--paper);border:1px solid var(--ink);border-radius:8px;z-index:80;display:none;font-family:"Instrument Sans",sans-serif;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#dev.open{display:block}
#dev .dhead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--hair);font-size:11.5px;letter-spacing:.08em}
#dev .dtag{font-size:10px;font-weight:600;letter-spacing:.14em;border:1px solid var(--ink);border-radius:4px;padding:1px 6px}
#dev .dbody{padding:10px 12px}
#dev .dmood{margin-bottom:8px}
#dev .bar{display:grid;grid-template-columns:70px 1fr 36px;align-items:center;gap:8px;font-size:11.5px;margin:3px 0;color:var(--mut)}
#dev .tr{height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
#dev .fl{height:100%;background:var(--mut);border-radius:3px;display:block}
#dev .fl.top{background:var(--blue)}
#dev .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;text-align:right}
#dev .drow{margin-top:7px;color:var(--ink)}
#dev .drow .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#dev .dfoot{border-top:1px solid var(--hair);padding:7px 12px;font-size:11px;color:var(--mut)}
#devx{margin-left:auto;background:none;border:0;color:var(--ink);font-size:15px;cursor:pointer;line-height:1;padding:2px 4px}
#devx:hover{color:var(--blue)}
#xdim{position:fixed;inset:0;background:rgba(17,17,17,.22);opacity:0;pointer-events:none;transition:opacity .26s ease;z-index:70}
#xdim.on{opacity:1}
#xbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);opacity:0;transition:transform .26s ease-out,opacity .26s ease;margin:0;padding:0;z-index:71;pointer-events:none;box-shadow:0 18px 60px rgba(0,0,0,.35);border-radius:8px;overflow:hidden;background:none;border:0}
#xbox.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#xbox img{display:block;width:100%;height:100%;object-fit:contain;cursor:zoom-in;border-radius:8px;background:none}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:40px}

function renderRead(animate,dir){
  hideSelPop();
  var html="",pages=paginate(scene);

  if(recapMode){
    html+='<div class="panelshead"><div class="kick2">End of chapter 1 &middot; Chapter in panels</div>';

    html+='<div class="sceneline sans">Whole chapter retold in six frames</div></div><div class="pgrid">';

      else html+='<div class="hatch"></div>';
      html+='<span class="pnum">'+(i+1)+'</span></div><div class="capbox">'+esc(p.cap)+'</div></div>';
    }
    html+='</div><div class="mocktag sans">Mock panels</div>';
    html+='<button class="ch2btn" id="ch2">Chapter 2 &rarr;</button>';
  }else{
    var isFirst=page===0;
    html+=headHTML(scene,isFirst);
    html+='<div class="body" id="tbody">';
    pages[page].forEach(function(b){
      if(b.kind==="p"){
        html+=paraHTML(b.i,b.text,(b.i===0&&isFirst&&b.c===0));
      }else{
        var f=null;
        (figures[scene]||[]).forEach(function(x){if(x.id===b.id)f=x;});
        if(f)html+=figHTML(f);
      }
    });
    html+='</div>';
    if(pages.length>1){
      html+='<div class="dots" role="tablist" aria-label="Pages">';
      for(var d=0;d<pages.length;d++)html+='<button data-dot="'+d+'" class="'+(d===page?"on":"")+'" aria-label="Page '+(d+1)+'"></button>';
      html+='</div>';
    }
  }
  if(animate&&!RM&&typeof dir==="number"){
    pagewrap.classList.remove("slide");
    pagewrap.style.transform="translateX("+(dir>0?"24px":"-24px")+")";
    pagewrap.style.opacity="0";
    pagewrap.innerHTML=html;
    wirePage();
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      pagewrap.classList.add("slide");
      pagewrap.style.transform="translateX(0)";
      pagewrap.style.opacity="1";
    });});
  }else{
    pagewrap.classList.remove("slide");
    pagewrap.style.transform="";pagewrap.style.opacity="";
    pagewrap.innerHTML=html;
    wirePage();
  }
  if(!recapMode&&safetyDepth<8){
    var guard=0;
    while(guard<8&&readcol.scrollHeight>readcol.clientHeight+1){
      var pg=pages[Math.min(page,pages.length-1)];
      if(!pg||!pg.length)break;
      if(pg.length===1&&page>0)break;
      var last=pg[pg.length-1],key=blockKey(last);
      if(!forceNext[scene])forceNext[scene]={};
      if(forceNext[scene][key])break;
      forceNext[scene][key]=1;
      safetyDepth++;
      try{
        pages=paginate(scene);
        if(page>pages.length-1)page=pages.length-1;
        if(page<0)page=0;
        pageMem[scene]=page;
        var isF=page===0,h2=headHTML(scene,isF)+'<div class="body" id="tbody">';
        pages[page].forEach(function(b){
          if(b.kind==="p"){h2+=paraHTML(b.i,b.text,(b.i===0&&isF&&b.c===0));}
          else{var ff=null;(figures[scene]||[]).forEach(function(x){if(x.id===b.id)ff=x;});if(ff)h2+=figHTML(ff);}
        });
        h2+='</div>';
        if(pages.length>1){h2+='<div class="dots" role="tablist" aria-label="Pages">';for(var dd=0;dd<pages.length;dd++)h2+='<button data-dot="'+dd+'" class="'+(dd===page?"on":"")+'" aria-label="Page '+(dd+1)+'"></button>';h2+='</div>';}
        pagewrap.classList.remove("slide");pagewrap.style.transform="";pagewrap.style.opacity="";
        pagewrap.innerHTML=h2;wirePage();
      }finally{safetyDepth--;}
      guard++;
    }
  }
  updateFolio();
  renderDev();
}
function wirePage(){

function gotoPage(p,dir){

function goStep(d){
  hideSelPop();

    if(d<0){recapMode=false;scene=4;page=paginate(4).length-1;pageMem[4]=page;renderImg();renderRead(true,-1);}
    return;
  }
  var pages=paginate(scene);
  if(page+d>=0&&page+d<pages.length){gotoPage(page+d,d);return;}
  var n=scene+d;
  if(d>0&&scene===4){recapMode=true;renderImg();renderRead(true,1);return;}
  if(n<1||n>4)return;
  recapMode=false;scene=n;
  page=d>0?0:paginate(n).length-1;

  renderImg();renderRead(true,d);

  var size=function(w,h){
    if(sized)return;sized=true;
    w=w||800;h=h||1000;

  };
  if(fi.complete&&fi.naturalWidth)size(fi.naturalWidth,fi.naturalHeight);
  var probe=new Image();

  probe.onerror=function(){size(fi.naturalWidth,fi.naturalHeight);};

function paraOf(node){
  while(node&&node!==pagewrap){
    if(node.nodeType===1&&node.hasAttribute&&node.hasAttribute("data-pi"))return node;
    node=node.parentNode;
  }
  return null;
}
document.addEventListener("mouseup",function(){
  setTimeout(function(){
    var s=getSelection();
    if(!s||s.isCollapsed||String(s).trim().length<3){hideSelPop();return;}
    if(!pagewrap.contains(s.anchorNode)||!pagewrap.contains(s.focusNode)){hideSelPop();return;}
    var r=s.getRangeAt(0).getBoundingClientRect();
    if(!r||(r.width===0&&r.height===0)){hideSelPop();return;}
    var endP=paraOf(s.focusNode);
    if(!endP){hideSelPop();return;}
    pendingSel={text:String(s).trim(),para:parseInt(endP.getAttribute("data-pi"),10)};
    selpop.style.display="block";
    var pw=selpop.offsetWidth;
    selpop.style.left=Math.max(8,Math.min(innerWidth-pw-8,r.left+r.width/2-pw/2))+"px";
    selpop.style.top=Math.max(8,r.top-8-selpop.offsetHeight)+"px";
  },10);
});

  if(lbOpen()){if(e.key==="Escape")closeLB();return;}
  if(pmOpen()){if(e.key==="Escape")closePanels();return;}
  if(devOpen&&(e.key==="Escape")){devOpen=false;renderDev();return;}
  var tag=(e.target&&e.target.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA")return;
  if(e.shiftKey&&(e.key==="D"||e.key==="d")){devOpen=!devOpen;renderDev();return;}
  if(e.key==="ArrowLeft")goStep(-1);
  else if(e.key==="ArrowRight")goStep(1);
  else if(e.key==="[")psGo(-1);
  else if(e.key==="]")psGo(1);
});
/* resize divider */
var divider=document.getElementById("divider"),dragging=false;
function defaultW(){return Math.round(mid.getBoundingClientRect().width*0.34);}
function applyW(px){
  px=Math.max(220,Math.min(Math.round(innerWidth*0.46),px));
  mid.style.setProperty("--imgw",px+"px");
  return px;
}
try{var saved=parseInt(localStorage.getItem("lectoria.proto.v3.split"),10);if(saved)applyW(saved);else applyW(defaultW());}catch(e){applyW(defaultW());}
divider.addEventListener("pointerdown",function(e){dragging=true;divider.classList.add("drag");divider.setPointerCapture(e.pointerId);});
divider.addEventListener("pointermove",function(e){
  if(!dragging)return;
  var r=mid.getBoundingClientRect();
  applyW(e.clientX-r.left);
});
divider.addEventListener("pointerup",function(e){
  if(!dragging)return;dragging=false;divider.classList.remove("drag");
  var r=mid.getBoundingClientRect();
  try{localStorage.setItem("lectoria.proto.v3.split",Math.round(e.clientX-r.left));}catch(x){}
  keepPage(null);
});
divider.addEventListener("dblclick",function(){var w=applyW(defaultW());try{localStorage.setItem("lectoria.proto.v3.split",w);}catch(x){}keepPage(null);});
window.addEventListener("resize",function(){keepPage(null);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){keepPage(null);});
/* theme */
var SUN='<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2 3.4 12.6"/></svg>';
var MOON='<svg width="16" height="16" viewBox="0 0 16 16"><path d="M13.5 9.5A5.8 5.8 0 0 1 6.5 2.5a5.8 5.8 0 1 0 7 7Z"/></svg>';
var themeBtn=document.getElementById("themeBtn");
function setTheme(t){document.documentElement.setAttribute("data-theme",t);themeBtn.innerHTML=(t==="dark"?SUN:MOON);try{localStorage.setItem("lectoria.proto.v3.theme",t);}catch(e){}}
if(q.has("dark"))setTheme("dark");
else{var st=null;try{st=localStorage.getItem("lectoria.proto.v3.theme");}catch(e){}setTheme(st==="dark"?"dark":"light");}
themeBtn.addEventListener("click",function(){setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");});
/* player mocks */
var playing=true,tPlay=document.getElementById("tPlay"),playIco=document.getElementById("playIco");
var P_PAUSE='<path d="M5.5 2.5v11M10.5 2.5v11"/>',P_PLAY='<path d="M5 2.5 12 8l-7 5.5v-11Z"/>';
tPlay.addEventListener("click",function(){
  playing=!playing;
  playIco.innerHTML=playing?P_PAUSE:P_PLAY;
  tPlay.setAttribute("aria-label",playing?"Pause music":"Play music");
});
document.getElementById("tPrev").addEventListener("click",function(){toast("Mock");});
document.getElementById("tNext").addEventListener("click",function(){toast("Mock");});
document.getElementById("muteBtn").addEventListener("click",function(){var v=document.getElementById("vol");v.value=(v.value==="0"?"70":"0");});
var segO=document.getElementById("segO"),segP=document.getElementById("segP");
segO.addEventListener("click",function(){segO.classList.add("on");segP.classList.remove("on");});
segP.addEventListener("click",function(){segP.classList.add("on");segO.classList.remove("on");});
document.getElementById("chopin").addEventListener("click",function(){toast("Mock");});
/* toast */
var toastT=null;
function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove("show");},1200);}
/* switcher */
var FILES=["01-folio-carousel.html","02-folio-pages.html","03-folio-margin.html"];
function psGo(d){window.location.href=FILES[(1+d+FILES.length)%FILES.length];}
(function(){
  if(location.search.indexOf("shot")!==-1){document.getElementById("protoSwitcher").style.display="none";return;}
  document.getElementById("psPrev").addEventListener("click",function(){psGo(-1);});
  document.getElementById("psNext").addEventListener("click",function(){psGo(1);});
})();
/* init */
if(q.has("pt")&&!q.has("gallery")&&scene===2){page=figPage(2,figures[2][0].id);pageMem[2]=page;}
if(q.has("gallery")){scene=2;page=0;pageMem[2]=0;}
if(q.has("panels")){scene=1;page=0;recapMode=false;}
renderImg();renderRead(false);
if(q.has("hover")){
  scene=2;pageMem[2]=page;revealed.add(2);
  renderImg();renderRead(false);
  var fi=document.getElementById("figImg");
  if(fi)expandImg(fi);
}
</script>
